<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Bedroom — Urban Nest</title>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase.js"></script>
  <script type="module" src="https://unpkg.com/@splinetool/viewer@1.12.98/build/spline-viewer.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; background: #0A0A0A; color: #F8F7F4; overflow: hidden; height: 100vh; width: 100vw; }

    nav { position: fixed; top: 0; left: 0; right: 0; z-index: 200; display: flex; justify-content: space-between; align-items: center; padding: 18px 36px; background: linear-gradient(to bottom, rgba(10,10,10,0.9), transparent); pointer-events: none; }
    nav a, nav span { pointer-events: all; }
    .logo { font-family: 'Bodoni Moda', serif; font-size: 18px; font-weight: 400; letter-spacing: 0.22em; color: #F8F7F4; text-decoration: none; display: flex; align-items: center; gap: 10px; }
    .logo-icon { width: 30px; height: 30px; border-radius: 50%; overflow: hidden; }
    .logo-icon img { width: 100%; height: 100%; object-fit: cover; }
    .nav-right { display: flex; align-items: center; gap: 16px; transition: opacity 0.3s; }
    .nav-room-label { font-size: 10px; letter-spacing: 0.22em; color: rgba(248,247,244,0.35); }
    .back-btn { font-size: 11px; letter-spacing: 0.14em; color: rgba(248,247,244,0.5); text-decoration: none; border: 0.5px solid rgba(248,247,244,0.15); padding: 7px 16px; border-radius: 20px; transition: all 0.2s; background: rgba(10,10,10,0.4); }
    .back-btn:hover { color: #F8F7F4; border-color: rgba(248,247,244,0.4); }
    body.panel-open .nav-right { opacity: 0; pointer-events: none; }

    #scene-wrap { position: fixed; inset: 0; z-index: 1; }
    #scene-wrap spline-viewer { position: absolute; inset: 0; width: 100%; height: 100%; }

    #loading { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; pointer-events: none; }
    #loading .spinner { width: 28px; height: 28px; border: 1.5px solid rgba(184,149,106,0.2); border-top-color: #B8956A; border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { font-size: 11px; letter-spacing: 0.2em; color: rgba(248,247,244,0.35); }

    #no-scene { position: fixed; inset: 0; z-index: 5; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; }
    #no-scene h2 { font-family: 'Bodoni Moda', serif; font-size: 26px; font-weight: 400; color: rgba(248,247,244,0.8); }
    #no-scene p { font-size: 11px; letter-spacing: 0.2em; color: rgba(248,247,244,0.35); }

    /* DOTS */
    #dots-layer { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
    .dot { position: absolute; transform: translate(-50%,-50%); pointer-events: all; cursor: pointer; }
    .dot-ring { width: 18px; height: 18px; border-radius: 50%; background: rgba(184,149,106,0.2); border: 1.5px solid #B8956A; display: flex; align-items: center; justify-content: center; animation: pulse 2.4s ease-in-out infinite; transition: transform 0.2s, background 0.2s; }
    .dot:hover .dot-ring { transform: scale(1.3); background: rgba(184,149,106,0.4); }
    .dot-ring::after { content: ''; width: 5px; height: 5px; border-radius: 50%; background: #B8956A; }
    @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(184,149,106,0.5)} 50%{box-shadow:0 0 0 6px rgba(184,149,106,0)} }
    .dot-label { position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: rgba(250,250,248,0.95); color: #111110; font-size: 10px; letter-spacing: 0.08em; white-space: nowrap; padding: 3px 8px; border-radius: 4px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
    .dot:hover .dot-label { opacity: 1; }

    #hint { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); z-index: 20; display: none; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 0.15em; color: rgba(248,247,244,0.3); pointer-events: none; white-space: nowrap; transition: opacity 0.5s; }
    #hint::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: #B8956A; animation: blink 2s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

    /* VIEW SWITCHER (shows when the room has several 3D renders) */
    #views { position: fixed; bottom: 24px; left: 24px; z-index: 30; display: none; gap: 8px; flex-wrap: wrap; max-width: 40vw; }
    .view-chip { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(248,247,244,0.5); background: rgba(10,10,10,0.7); border: 0.5px solid rgba(248,247,244,0.15); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.2s; }
    .view-chip:hover { color: #F8F7F4; border-color: rgba(248,247,244,0.4); }
    .view-chip.active { color: #B8956A; border-color: rgba(184,149,106,0.6); background: rgba(184,149,106,0.12); }
    body.panel-open #views { opacity: 0; pointer-events: none; }

    /* PANEL */
    #panel { position: fixed; top: 0; right: 0; bottom: 0; width: 50vw; background: #FAFAF8; z-index: 150; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.4,0,0.2,1); overflow-y: auto; }
    #panel.open { transform: translateX(0); }

    .panel-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 0.5px solid #E0DFD9; flex-shrink: 0; position: sticky; top: 0; background: #FAFAF8; z-index: 5; }
    .panel-back { display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: 0.12em; color: #6B6B68; cursor: pointer; border: none; background: none; transition: color 0.2s; padding: 6px 0; }
    .panel-back:hover { color: #111110; }
    .panel-room-tag { font-size: 10px; letter-spacing: 0.2em; color: #B8956A; }

    .panel-3d { width: 100%; height: 50vh; background: #111110; flex-shrink: 0; position: relative; overflow: hidden; }
    #product-viewer-wrap { position: absolute; inset: 0; width: 100%; height: 100%; }
    .zoom-controls { position: absolute; bottom: 14px; right: 14px; z-index: 10; display: flex; flex-direction: column; gap: 4px; }
    .zoom-btn { width: 32px; height: 32px; background: rgba(250,250,248,0.1); border: 0.5px solid rgba(250,250,248,0.2); color: #FAFAF8; font-size: 18px; cursor: pointer; border-radius: 4px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
    .zoom-btn:hover { background: rgba(184,149,106,0.2); border-color: #B8956A; color: #B8956A; }
    .panel-3d-hint { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); font-size: 10px; letter-spacing: 0.1em; color: rgba(250,250,248,0.2); pointer-events: none; white-space: nowrap; }

    .panel-body { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .panel-tag { font-size: 10px; letter-spacing: 0.22em; color: #B8956A; }
    .panel-name { font-family: 'Bodoni Moda', serif; font-size: 28px; font-weight: 400; color: #111110; line-height: 1.15; }
    .panel-desc { font-size: 14px; color: #6B6B68; line-height: 1.9; }
    .divider { height: 0.5px; background: #E0DFD9; }
    .specs { display: flex; flex-direction: column; border: 0.5px solid #E0DFD9; border-radius: 4px; overflow: hidden; }
    .specs:empty { display: none; }
    .spec-row { display: flex; justify-content: space-between; padding: 10px 14px; font-size: 12px; border-bottom: 0.5px solid #E0DFD9; }
    .spec-row:last-child { border-bottom: none; }
    .spec-label { color: #6B6B68; }
    .spec-val { color: #111110; font-weight: 500; }
    .similar-note { font-size: 11px; color: #6B6B68; font-style: italic; }
    .btn-similar { display: block; text-align: center; padding: 14px; background: #111110; color: #FAFAF8; font-size: 11px; font-weight: 500; letter-spacing: 0.18em; border-radius: 4px; text-decoration: none; transition: background 0.2s; margin-bottom: 24px; }
    .btn-similar:hover { background: #B8956A; }

    @media (max-width: 768px) {
      nav { padding: 14px 16px; }
      .nav-room-label { display: none; }
      #panel { width: 100vw; top: auto; height: 85vh; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.4,0,0.2,1); }
      #panel.open { transform: translateY(0); }
      .panel-3d { height: 40vh; }
      .panel-name { font-size: 22px; }
      #hint { font-size: 10px; bottom: 20px; }
      #views { bottom: 60px; left: 16px; max-width: 70vw; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="logo">
      <div class="logo-icon"><img src="logo-icon.png" alt="Urban Nest"/></div>
      URBAN NEST
    </a>
    <div class="nav-right">
      <span class="nav-room-label">THE BEDROOM</span>
      <a href="index.html" class="back-btn">← ALL SPACES</a>
    </div>
  </nav>

  <div id="scene-wrap"></div>

  <div id="loading">
    <div class="spinner"></div>
    <p>ENTERING THE BEDROOM</p>
  </div>

  <div id="no-scene">
    <h2>The Bedroom is being prepared</h2>
    <p>THIS SPACE WILL OPEN SOON</p>
  </div>

  <div id="dots-layer"></div>
  <div id="hint">DRAG TO EXPLORE THE SPACE</div>
  <div id="views"></div>

  <div id="panel">
    <div class="panel-header">
      <button class="panel-back" id="close-btn">← BACK TO BEDROOM</button>
      <span class="panel-room-tag">THE BEDROOM</span>
    </div>
    <div class="panel-3d" id="panel-3d">
      <div id="product-viewer-wrap"></div>
      <div class="zoom-controls">
        <button class="zoom-btn" id="zoom-in">+</button>
        <button class="zoom-btn" id="zoom-out">−</button>
      </div>
      <div class="panel-3d-hint">DRAG TO ROTATE</div>
    </div>
    <div class="panel-body">
      <div class="panel-tag" id="p-tag"></div>
      <div class="panel-name" id="p-name"></div>
      <div class="panel-desc" id="p-desc"></div>
      <div class="divider"></div>
      <div class="specs" id="p-specs"></div>
      <p class="similar-note">Similar style · Available in India</p>
      <a class="btn-similar" id="p-buy" href="#" target="_blank" rel="noopener sponsored">SHOP ON AMAZON →</a>
    </div>
  </div>

  <script>
    const ROOM = 'bed';
    const LOADING_TEXT = 'ENTERING THE BEDROOM';
    // Fallback scene when the database has no active scenes for this room
    const DEFAULT_SCENE = null;
    const FALLBACK_PRODUCTS = [];

    let scenes = [];          // active scenes for this room (from Admin → Spline Scenes)
    let currentSceneId = null;
    let allProducts = [];     // published products for this room (from Admin → 3D Products)
    let products = {};        // id → product, for the dots currently shown
    let splineApp = null;
    let trackingEnabled = false;

    (async () => {
      const [sceneRes, prodRes] = await Promise.all([
        db.from('spline_scenes').select('id,name,url')
          .eq('page_placement', ROOM).eq('active', true)
          .order('created_at').then(r => r.data, () => null),
        db.from('room_products').select('*')
          .eq('room', ROOM).eq('published', true)
          .order('sort_order').order('created_at').then(r => r.data, () => null),
      ]);
      scenes = sceneRes || [];
      if (!scenes.length && DEFAULT_SCENE) scenes = [{ id: null, name: 'Main View', url: DEFAULT_SCENE }];
      allProducts = (prodRes && prodRes.length) ? prodRes : FALLBACK_PRODUCTS;

      if (!scenes.length) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('no-scene').style.display = 'flex';
        return;
      }
      renderViewChips();
      showScene(0);
    })();

    // ── SCENES & VIEW SWITCHER ──
    function renderViewChips() {
      if (scenes.length < 2) return;
      const views = document.getElementById('views');
      views.style.display = 'flex';
      views.innerHTML = '';
      scenes.forEach((s, i) => {
        const chip = document.createElement('button');
        chip.className = 'view-chip';
        chip.textContent = s.name || ('View ' + (i + 1));
        chip.addEventListener('click', () => showScene(i));
        views.appendChild(chip);
      });
    }

    function showScene(i) {
      const scene = scenes[i];
      currentSceneId = scene.id;
      document.querySelectorAll('#views .view-chip').forEach((c, j) => c.classList.toggle('active', j === i));

      const loading = document.getElementById('loading');
      loading.style.display = 'flex';
      document.getElementById('hint').style.display = 'none';

      trackingEnabled = false;
      splineApp = null;
      const wrap = document.getElementById('scene-wrap');
      wrap.innerHTML = '';

      const viewer = document.createElement('spline-viewer');
      viewer.setAttribute('url', scene.url);
      const hideLoader = () => {
        loading.style.display = 'none';
        document.getElementById('hint').style.display = 'flex';
      };
      viewer.addEventListener('load', () => {
        hideLoader();
        splineApp = viewer.spline;
        if (splineApp) setTimeout(() => { trackingEnabled = true; trackDots(); }, 300);
      });
      // The load event doesn't fire for newer .splinecode files — watch for the canvas instead
      const poll = setInterval(() => {
        if (!viewer.isConnected) { clearInterval(poll); return; }
        if (viewer.shadowRoot && viewer.shadowRoot.querySelector('canvas')) {
          clearInterval(poll);
          hideLoader();
        }
      }, 400);
      wrap.appendChild(viewer);
      renderDots();
    }

    // ── DOTS (managed in Admin → 3D Products) ──
    function renderDots() {
      document.getElementById('dots-layer').innerHTML = '';
      products = {};
      const rows = allProducts.filter(p => !p.scene_id || p.scene_id === currentSceneId);
      rows.forEach(p => { products[p.id] = p; addDot(p); });
      document.getElementById('hint').textContent =
        rows.length ? 'CLICK THE GOLD DOTS TO EXPLORE' : 'DRAG TO EXPLORE THE SPACE';
    }

    function addDot(p) {
      const dot = document.createElement('div');
      dot.className = 'dot';
      dot.dataset.pid = p.id;
      if (p.object_name) dot.dataset.objectName = p.object_name;
      dot.style.left = (p.dot_x ?? 50) + '%';
      dot.style.top  = (p.dot_y ?? 50) + '%';
      dot.innerHTML = `<span class="dot-label">${p.name}</span><div class="dot-ring"></div>`;
      dot.addEventListener('click', (e) => { e.stopPropagation(); openPanel(p.id); });
      document.getElementById('dots-layer').appendChild(dot);
    }

    // Dots with a Spline object name follow their 3D object as the camera moves
    function trackDots() {
      if (!trackingEnabled || !splineApp) return;
      const cam = splineApp.camera;
      if (!cam) { requestAnimationFrame(trackDots); return; }
      document.querySelectorAll('.dot[data-object-name]').forEach(dot => {
        const obj = splineApp.findObjectByName(dot.dataset.objectName);
        if (!obj) return;
        try {
          const wp = obj.position.clone();
          if (typeof obj.getWorldPosition === 'function') obj.getWorldPosition(wp);
          wp.project(cam);
          const x = ((wp.x + 1) / 2) * 100;
          const y = ((-wp.y + 1) / 2) * 100;
          if (x > 0 && x < 100 && y > 0 && y < 100) {
            dot.style.left = x + '%';
            dot.style.top  = y + '%';
          }
        } catch (_) {}
      });
      requestAnimationFrame(trackDots);
    }

    // ── PRODUCT PANEL ──
    let zoomLevel = 1;
    let currentViewer = null;

    function openPanel(id) {
      const p = products[id];
      if (!p) return;
      const wrap = document.getElementById('product-viewer-wrap');
      wrap.innerHTML = '';
      const panel3d = document.getElementById('panel-3d');
      if (p.spline_url) {
        panel3d.style.display = '';
        const viewer = document.createElement('spline-viewer');
        viewer.setAttribute('url', p.spline_url);
        viewer.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;';
        wrap.appendChild(viewer);
        currentViewer = viewer;
      } else {
        panel3d.style.display = 'none';
        currentViewer = null;
      }
      zoomLevel = 1;
      document.getElementById('p-tag').textContent  = p.tag || '';
      document.getElementById('p-name').textContent = p.name;
      document.getElementById('p-desc').textContent = p.description || '';
      const buy = document.getElementById('p-buy');
      buy.style.display = p.buy_link ? '' : 'none';
      buy.href = p.buy_link || '#';
      document.getElementById('p-specs').innerHTML = (p.specs || []).map(([l, v]) =>
        `<div class="spec-row"><span class="spec-label">${l}</span><span class="spec-val">${v}</span></div>`
      ).join('');
      document.getElementById('panel').classList.add('open');
      document.body.classList.add('panel-open');
      document.getElementById('hint').style.opacity = '0';
      document.getElementById('panel').scrollTop = 0;
    }

    function closePanel() {
      document.getElementById('panel').classList.remove('open');
      document.body.classList.remove('panel-open');
      document.getElementById('hint').style.opacity = '1';
      setTimeout(() => {
        document.getElementById('product-viewer-wrap').innerHTML = '';
        currentViewer = null;
      }, 400);
    }

    document.getElementById('close-btn').addEventListener('click', closePanel);
    document.getElementById('zoom-in').addEventListener('click', () => {
      zoomLevel = Math.min(zoomLevel + 0.2, 3);
      if (currentViewer) currentViewer.style.transform = `scale(${zoomLevel})`;
    });
    document.getElementById('zoom-out').addEventListener('click', () => {
      zoomLevel = Math.max(zoomLevel - 0.2, 0.5);
      if (currentViewer) currentViewer.style.transform = `scale(${zoomLevel})`;
    });
  </script>

</body>
</html>
