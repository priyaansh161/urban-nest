[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "*"

[[headers]]
  for = "/*.splinecode"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Content-Type = "application/octet-stream"

# ── THE PRINTED QR ──
# The QR on the visiting card encodes /hello, not the homepage. A printed
# QR is set in ink; where /hello *goes* is the line below, and that can be
# changed whenever without reprinting a box of cards.
#
# 302, deliberately, not 301. A 301 says "moved permanently" and phones
# cache it hard — a device that followed /hello once would keep going to
# the old destination long after this line changed, which is exactly the
# thing the redirect exists to prevent.
[[redirects]]
  from = "/hello"
  to = "/"
  status = 302

# ── CHECKOUT FUNCTIONS ──
# The three endpoints in netlify/functions/. They live outside dist/ on
# purpose: build-site.mjs assembles dist from an allow list of static files,
# while functions are uploaded separately by the CLI, which reads this block.
# Deploy from the project root or it will not find them.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
