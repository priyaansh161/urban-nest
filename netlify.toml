[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "*"

[[headers]]
  for = "/*.splinecode"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Content-Type = "application/octet-stream"

# ── THE INSTALLABLE APP ──
# no-cache on the service worker so a phone checks for a new one on every
# visit; a cached sw.js would keep an old caching strategy alive for a day.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# ── THE PRINTED QR ──
# The QR on the visiting card encodes /hello, not the homepage. A printed
# QR is set in ink; where /hello *goes* is the line below, and that can be
# changed whenever without reprinting a box of cards.
#
# 302, deliberately, not 301. A 301 says "moved permanently" and phones
# cache it hard — a device that followed /hello once would keep going to
# the old destination long after this line changed, which is exactly the
# thing the redirect exists to prevent.
[[redirects]]
  from = "/hello"
  to = "/"
  status = 302

# ── THE DOMAIN ──
# storeurbannest.in is the address. storeurbannest.co.in and the original
# storeurbannest.netlify.app both still reach this site, so each is sent to
# the same page on .in — one address for Google, for link previews, and in
# the browser bar. www is not listed: Netlify already sends www to the bare
# domain once .in is set as primary.
#
# DEPLOY ORDER MATTERS. Deploy this only after https://storeurbannest.in is
# connected in Netlify and loads with its padlock. Deployed any earlier, the
# netlify.app address would forward every visitor to a domain that does not
# answer yet, and the site would be unreachable.
#
# 301 here, unlike /hello above: these addresses are never meant to change.
# The printed QR still works: it ends on the homepage at .in, whichever of
# the two redirects Netlify happens to apply first.
[[redirects]]
  from = "https://storeurbannest.netlify.app/*"
  to = "https://storeurbannest.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://storeurbannest.co.in/*"
  to = "https://storeurbannest.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.storeurbannest.co.in/*"
  to = "https://storeurbannest.in/:splat"
  status = 301
  force = true

# ── CHECKOUT FUNCTIONS ──
# The three endpoints in netlify/functions/. They live outside dist/ on
# purpose: build-site.mjs assembles dist from an allow list of static files,
# while functions are uploaded separately by the CLI, which reads this block.
# Deploy from the project root or it will not find them.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
