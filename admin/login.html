<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Login — Urban Nest</title>
<link rel="icon" type="image/png" href="../favicon.png"/>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/admin/config.js"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --gold: #B8956A; --white: #FAFAF8;
    --black: #111110; --grey: #6B6B68; --border: #E0DFD9;
  }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--black);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .bg-grid {
    position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(250,250,248,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(250,250,248,0.03) 1px, transparent 1px);
    background-size: 80px 80px;
  }
  .login-card {
    position: relative; z-index: 1;
    background: var(--white);
    width: 420px; padding: 56px 48px;
  }
  .brand {
    text-align: center; margin-bottom: 40px;
  }
  .brand-name {
    font-family: 'Bodoni Moda', serif;
    font-size: 22px; letter-spacing: 0.2em; color: var(--black);
    display: block; margin-bottom: 6px;
  }
  .brand-tag {
    font-size: 10px; letter-spacing: 0.3em;
    text-transform: uppercase; color: var(--gold);
  }
  .divider { width: 40px; height: 1px; background: var(--border); margin: 24px auto; }
  label {
    display: block; font-size: 10px; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--grey); margin-bottom: 8px;
  }
  input {
    width: 100%; padding: 12px 16px;
    border: 0.5px solid var(--border); background: var(--white);
    font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--black);
    outline: none; transition: border-color 0.2s; margin-bottom: 20px;
  }
  input:focus { border-color: var(--gold); }
  /* Targeted by id, not by [type="password"] — the type is what the toggle
     changes, and a rule keyed to it would drop its own margin mid-click and
     shift the form. */
  #password { margin-bottom: 10px; }
  .show-pw {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    font-size: 11.5px; letter-spacing: 0.04em; text-transform: none;
    color: var(--grey); margin-bottom: 22px; user-select: none;
  }
  .show-pw:hover { color: var(--black); }
  .show-pw input { width: auto; margin: 0; padding: 0; accent-color: var(--gold); cursor: pointer; }
  .btn {
    width: 100%; padding: 14px;
    background: var(--black); color: var(--white);
    border: none; cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
    transition: background 0.2s; margin-top: 8px;
  }
  .btn:hover { background: #222; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .error-msg {
    font-size: 12px; color: #c0392b;
    text-align: center; margin-top: 16px; min-height: 18px;
  }
  .back-link {
    display: block; text-align: center; margin-top: 28px;
    font-size: 11px; letter-spacing: 0.12em; color: var(--grey);
    text-decoration: none; transition: color 0.2s;
  }
  .back-link:hover { color: var(--black); }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="login-card">
  <div class="brand">
    <span class="brand-name">Urban Nest</span>
    <span class="brand-tag">Admin Access</span>
  </div>
  <div class="divider"></div>
  <form id="loginForm">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="admin@urbannest.com" required autocomplete="email"/>
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password"/>
    <label class="show-pw" for="showPw">
      <input type="checkbox" id="showPw"/> Show password
    </label>
    <button class="btn" type="submit" id="loginBtn">Enter</button>
    <p class="error-msg" id="errorMsg"></p>
  </form>
  <a href="../index.html" class="back-link">← Back to Urban Nest</a>
</div>
<script>
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  /* Reveal the password. Returns focus to the field with the caret at the end,
     so a mistyped password can be corrected without reaching for the mouse
     again — which is the whole reason for looking at it. */
  document.getElementById('showPw').addEventListener('change', (e) => {
    const pw = document.getElementById('password');
    pw.type = e.target.checked ? 'text' : 'password';
    pw.focus();
    const end = pw.value.length;
    try { pw.setSelectionRange(end, end); } catch (err) {}
  });

  // Explain why they were signed out, when that is why they are here.
  (function showEndedNotice() {
    const reason = new URLSearchParams(location.search).get('ended');
    if (!reason) return;
    document.getElementById('errorMsg').textContent =
      reason === 'idle'
        ? 'Signed out after an hour of inactivity. Please sign in again.'
        : 'Your session expired. Please sign in again.';
  })();

  // Already logged in → go to dashboard
  db.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = 'index.html';
  });

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('errorMsg');
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    err.textContent = '';

    const { error } = await db.auth.signInWithPassword({
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
    });

    if (error) {
      err.textContent = error.message;
      btn.disabled = false;
      btn.textContent = 'Enter';
    } else {
      // Start the session clock fresh. Without this, timestamps left over
      // from a previous session would read as expired and sign you straight
      // back out — locking you out of the admin entirely.
      try {
        const now = String(Date.now());
        localStorage.setItem('un-admin-started', now);
        localStorage.setItem('un-admin-last-seen', now);
      } catch (e) {}
      window.location.href = 'index.html';
    }
  });
</script>
</body>
</html>
