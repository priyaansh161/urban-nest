<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Feedback — Urban Nest Admin</title>
<link rel="icon" type="image/png" href="../favicon.png"/>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --gold: #B8956A; --gold-light: rgba(184,149,106,0.1); --white: #FAFAF8; --black: #111110; --grey: #6B6B68; --border: #E0DFD9; --bg: #F4F3EF; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--black); display: flex; min-height: 100vh; }
  .sidebar { width: 220px; min-height: 100vh; background: var(--black); display: flex; flex-direction: column; position: fixed; left: 0; top: 0; bottom: 0; z-index: 50; }
  .sidebar-brand { padding: 32px 24px 24px; border-bottom: 0.5px solid rgba(255,255,255,0.08); }
  .sidebar-brand-name { font-family: 'Bodoni Moda', serif; font-size: 15px; letter-spacing: 0.16em; color: var(--white); display: block; }
  .sidebar-brand-tag { font-size: 9px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--gold); margin-top: 4px; display: block; }
  .sidebar-nav { flex: 1; padding: 16px 0; }
  .nav-group-label { font-size: 9px; letter-spacing: 0.25em; text-transform: uppercase; color: rgba(255,255,255,0.25); padding: 16px 24px 8px; }
  .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 24px; text-decoration: none; font-size: 12px; letter-spacing: 0.08em; color: rgba(255,255,255,0.5); transition: all 0.2s; border-left: 2px solid transparent; }
  .nav-item:hover { color: var(--white); background: rgba(255,255,255,0.04); }
  .nav-item.active { color: var(--white); border-left-color: var(--gold); background: rgba(184,149,106,0.08); }
  .nav-item .icon { font-size: 14px; width: 18px; text-align: center; }
  .sidebar-footer { padding: 20px 24px; border-top: 0.5px solid rgba(255,255,255,0.08); }
  .sign-out-btn { width: 100%; padding: 10px 16px; background: transparent; border: 0.5px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.4); font-family: 'DM Sans', sans-serif; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; transition: all 0.2s; }
  .sign-out-btn:hover { border-color: rgba(255,255,255,0.4); color: var(--white); }
  .view-site-link { display: block; font-size: 10px; letter-spacing: 0.15em; color: rgba(255,255,255,0.25); text-decoration: none; text-align: center; margin-top: 12px; transition: color 0.2s; }
  .view-site-link:hover { color: rgba(255,255,255,0.5); }

  .main { margin-left: 220px; flex: 1; padding: 48px; }
  .page-header { margin-bottom: 32px; display: flex; justify-content: space-between; align-items: flex-start; }
  .page-header h1 { font-family: 'Bodoni Moda', serif; font-size: 28px; font-weight: 400; }
  .page-header p { font-size: 13px; color: var(--grey); margin-top: 4px; }

  .filter-bar { display: flex; gap: 8px; margin-bottom: 24px; }
  .filter-btn { padding: 8px 20px; border: 0.5px solid var(--border); background: transparent; font-family: 'DM Sans', sans-serif; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--grey); cursor: pointer; transition: all 0.2s; }
  .filter-btn:hover { color: var(--black); border-color: var(--black); }
  .filter-btn.active { background: var(--black); color: var(--white); border-color: var(--black); }

  .feedback-list { display: flex; flex-direction: column; gap: 2px; }
  .feedback-card { background: var(--white); border: 0.5px solid var(--border); padding: 24px 28px; transition: border-color 0.2s; }
  .feedback-card.unread { border-left: 3px solid var(--gold); }
  .feedback-card:hover { border-color: #ccc; }
  .feedback-meta { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .feedback-author { font-weight: 500; font-size: 14px; }
  .feedback-email { font-size: 11px; color: var(--grey); margin-top: 2px; }
  .feedback-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .feedback-date { font-size: 11px; color: var(--grey); }
  .feedback-page { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--grey); }
  .stars { color: var(--gold); font-size: 13px; letter-spacing: 1px; }
  .feedback-message { font-size: 14px; line-height: 1.7; color: #333; margin-bottom: 16px; }
  .feedback-actions { display: flex; gap: 8px; }
  .row-btn { padding: 5px 14px; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; border: 0.5px solid var(--border); background: transparent; cursor: pointer; color: var(--grey); transition: all 0.2s; font-family: 'DM Sans', sans-serif; }
  .row-btn:hover { border-color: var(--black); color: var(--black); }
  .row-btn.danger { color: #c0392b; border-color: rgba(192,57,43,0.3); }
  .row-btn.danger:hover { background: rgba(192,57,43,0.05); }
  .badge { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 8px; border-radius: 2px; }
  .badge-gold { background: var(--gold-light); color: var(--gold); }
  .badge-grey { background: #eee; color: var(--grey); }
  .empty-state { padding: 64px 24px; text-align: center; color: var(--grey); font-size: 13px; background: var(--white); border: 0.5px solid var(--border); }

  .toast { position: fixed; bottom: 32px; right: 32px; z-index: 9999; padding: 14px 24px; font-size: 13px; font-family: 'DM Sans', sans-serif; background: var(--black); color: var(--white); transform: translateY(20px); opacity: 0; transition: all 0.3s; }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast-error { background: #c0392b; }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-brand">
    <span class="sidebar-brand-name">Urban Nest</span>
    <span class="sidebar-brand-tag">Admin</span>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-group-label">Overview</div>
    <a href="index.html" class="nav-item"><span class="icon">◈</span> Dashboard</a>
    <div class="nav-group-label">Content</div>
    <a href="nest.html" class="nav-item"><span class="icon">✦</span> The Nest</a>
    <a href="collection.html" class="nav-item"><span class="icon">◻</span> Collection</a>
    <a href="spline.html" class="nav-item"><span class="icon">◉</span> Spline Scenes</a>
    <a href="products.html" class="nav-item"><span class="icon">◆</span> 3D Products</a>
    <div class="nav-group-label">Content Creation</div>
    <a href="social.html" class="nav-item"><span class="icon">▣</span> Media Engagement</a>
    <a href="caption.html" class="nav-item"><span class="icon">✎</span> Caption</a>
    <a href="article-card.html" class="nav-item"><span class="icon">▤</span> Article Cards</a>
    <div class="nav-group-label">Community</div>
    <a href="feedback.html" class="nav-item active"><span class="icon">◌</span> Feedback</a>
    <a href="subscribers.html" class="nav-item"><span class="icon">◎</span> Subscribers</a>
  </nav>
  <div class="sidebar-footer">
    <button class="sign-out-btn" onclick="adminSignOut()">Sign Out</button>
    <a href="../index.html" class="view-site-link" target="_blank">View Site →</a>
  </div>
</aside>

<main class="main">
  <div class="page-header">
    <div>
      <h1>Feedback</h1>
      <p>Community submissions and visitor messages</p>
    </div>
    <button class="filter-btn" onclick="markAllRead()" style="border-color:var(--gold);color:var(--gold)">Mark All Read</button>
  </div>

  <div class="filter-bar">
    <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
    <button class="filter-btn" onclick="setFilter('unread', this)">Unread</button>
    <button class="filter-btn" onclick="setFilter('read', this)">Read</button>
  </div>

  <div class="feedback-list" id="feedbackList">
    <div class="empty-state">Loading feedback…</div>
  </div>
</main>

<script>
let feedback = [];
let currentFilter = 'all';

(async () => { await requireAuth(); loadFeedback(); })();

async function loadFeedback() {
  const { data, error } = await db.from('feedback')
    .select('*').order('created_at', { ascending: false });
  if (error) { showToast('Failed to load feedback', 'error'); return; }
  feedback = data || [];
  renderList();
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList();
}

function renderList() {
  const filtered = currentFilter === 'all'
    ? feedback
    : feedback.filter(f => f.status === currentFilter);
  const el = document.getElementById('feedbackList');
  if (!filtered.length) {
    el.innerHTML = `<div class="empty-state">No ${currentFilter === 'all' ? '' : currentFilter + ' '}feedback yet.</div>`;
    return;
  }
  el.innerHTML = filtered.map(f => `
    <div class="feedback-card ${f.status === 'unread' ? 'unread' : ''}">
      <div class="feedback-meta">
        <div>
          <div class="feedback-author">${f.name || 'Anonymous'}</div>
          ${f.email ? `<div class="feedback-email">${f.email}</div>` : ''}
        </div>
        <div class="feedback-right">
          <span class="feedback-date">${new Date(f.created_at).toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'})}</span>
          ${f.page ? `<span class="feedback-page">${f.page}</span>` : ''}
          ${f.rating ? `<span class="stars">${'★'.repeat(f.rating)}${'☆'.repeat(5 - f.rating)}</span>` : ''}
          <span class="badge ${f.status === 'unread' ? 'badge-gold' : 'badge-grey'}">${f.status}</span>
        </div>
      </div>
      <div class="feedback-message">"${f.message}"</div>
      <div class="feedback-actions">
        ${f.status === 'unread'
          ? `<button class="row-btn" onclick="markRead('${f.id}')">Mark Read</button>`
          : `<button class="row-btn" onclick="markUnread('${f.id}')">Mark Unread</button>`}
        <button class="row-btn danger" onclick="deleteFeedback('${f.id}')">Delete</button>
      </div>
    </div>`).join('');
}

async function markRead(id) {
  const { error } = await db.from('feedback').update({ status: 'read' }).eq('id', id);
  if (error) { showToast('Update failed', 'error'); return; }
  const item = feedback.find(f => f.id === id);
  if (item) item.status = 'read';
  renderList();
}

async function markUnread(id) {
  const { error } = await db.from('feedback').update({ status: 'unread' }).eq('id', id);
  if (error) { showToast('Update failed', 'error'); return; }
  const item = feedback.find(f => f.id === id);
  if (item) item.status = 'unread';
  renderList();
}

async function markAllRead() {
  const { error } = await db.from('feedback').update({ status: 'read' }).eq('status', 'unread');
  if (error) { showToast('Update failed', 'error'); return; }
  feedback.forEach(f => f.status = 'read');
  showToast('All marked as read');
  renderList();
}

async function deleteFeedback(id) {
  if (!confirm('Delete this message?')) return;
  const { error } = await db.from('feedback').delete().eq('id', id);
  if (error) { showToast('Delete failed', 'error'); return; }
  feedback = feedback.filter(f => f.id !== id);
  showToast('Message deleted');
  renderList();
}
</script>
</body>
</html>
