<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hall Blueprint · Urban Nest</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#14284b; --ice:#cfe0ff; --org:#ff8a52; --page:#f4f3ef; }
  body { margin:0; background:var(--page); font-family:Inter,sans-serif; color:#1d2533; }
  h1 { font-size:22px; margin:22px 24px 4px; } p.sub { margin:0 24px 16px; color:#555; font-size:14px; }
  .row { display:flex; gap:18px; padding:0 24px 24px; flex-wrap:wrap; }
  .card { background:var(--bg); border-radius:14px; flex:1 1 560px; position:relative; padding:34px 10px 10px; }
  .card .tag { position:absolute; left:18px; top:14px; color:var(--ice); font-size:11px; letter-spacing:.14em; font-weight:700; }
  .card svg { width:100%; height:auto; display:block; }
  ul { margin:0 24px 30px; columns:2; font-size:13px; color:#333; } li { margin:0 0 4px; }
</style></head><body>
<h1>The Hall: living + dining (Noida 3BHK)</h1>
<p class="sub">3.5 m x 7.8 m, 3.0 m slab, false ceiling at 2.75 m. Balcony at the top of the plan, main door at the bottom. Orange = tappable products.</p>
<div class="row"><div class="card"><span class="tag">FLOOR PLAN</span><div id="plan"></div></div><div class="card"><span class="tag">3D MODEL</span><div id="model"></div></div></div>
<ul id="list"></ul>
<script>
var NS = 'http://www.w3.org/2000/svg', ICE = '#cfe0ff', ORG = '#ff8a52', BG = '#14284b';
function el(tag, attrs, parent){ var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function label(parent, x, y, str, o){ o = o || {}; var t = el('text', {x:x, y:y, fill:o.fill||ICE, 'font-size':o.size||12, 'font-family':'Inter,sans-serif','font-weight':600,'text-anchor':o.anchor||'middle'}, parent); if (o.rot) t.setAttribute('transform','rotate('+o.rot+' '+x+' '+y+')'); if (o.halo){ t.setAttribute('stroke',BG); t.setAttribute('stroke-width',4); t.setAttribute('paint-order','stroke'); } t.textContent = str; return t; }

// three.js coordinates: x across (left wall -1.75 .. right wall 1.75), z along (balcony end -3.9 .. main-door end 3.9), y up
var P = { w:3.5, d:7.8, h:3.0, x1:-1.75, x2:1.75, z1:-3.9, z2:3.9,
  rug:[{x1:-0.85,x2:0.85,z1:0.9,z2:3.3}],
  open:[{x1:-1.25,x2:1.25,z1:-3.9,z2:-3.9,y1:0,y2:2.45,kind:'window',n:'Balcony sliding door'},
        {x1:0.50,x2:1.55,z1:3.9,z2:3.9,y1:0,y2:2.18,kind:'door',n:'Main door'},
        {x1:-1.75,x2:-1.75,z1:-3.35,z2:-2.45,y1:0,y2:2.25,kind:'opening',n:'Kitchen'},
        {x1:-1.75,x2:-1.75,z1:-0.25,z2:0.75,y1:0,y2:2.25,kind:'opening',n:'To bedrooms'}],
  furn:[{x1:-1.705,x2:-0.80,z1:0.78,z2:3.58,y1:0,y2:0.61,n:'L-sofa'},{x1:-0.80,x2:-0.055,z1:0.78,z2:2.0,y1:0,y2:0.45,n:'Chaise'},
        {x1:0.07,x2:0.65,z1:1.65,z2:2.65,y1:0,y2:0.38,n:''},
        {x1:1.715,x2:1.75,z1:0.45,z2:2.65,y1:0,y2:2.75,n:''},{x1:1.31,x2:1.73,z1:0.60,z2:2.50,y1:0.24,y2:0.60,n:'TV unit'},
        {x1:1.20,x2:1.60,z1:-0.45,z2:-0.05,y1:0,y2:1.85,n:''},{x1:-1.75,x2:-1.54,z1:2.50,z2:3.40,y1:2.25,y2:2.55,n:'AC'},
        {x1:-0.60,x2:0.30,z1:-2.95,z2:-1.15,y1:0,y2:0.76,n:'Dining table'},
        {x1:-1.0,x2:-0.54,z1:-1.83,z2:-1.37,y1:0,y2:0.97,n:''},{x1:-1.0,x2:-0.54,z1:-2.73,z2:-2.27,y1:0,y2:0.97,n:''},
        {x1:0.24,x2:0.70,z1:-1.83,z2:-1.37,y1:0,y2:0.97,n:''},{x1:0.24,x2:0.70,z1:-2.73,z2:-2.27,y1:0,y2:0.97,n:''},
        {x1:-0.38,x2:0.08,z1:-1.11,z2:-0.65,y1:0,y2:0.97,n:''},{x1:-0.38,x2:0.08,z1:-3.45,z2:-2.99,y1:0,y2:0.97,n:''},
        {x1:1.33,x2:1.75,z1:-2.55,z2:-0.95,y1:0,y2:2.20,n:'Crockery unit'},{x1:1.40,x2:1.75,z1:2.90,z2:3.80,y1:0.15,y2:0.98,n:'Shoe cabinet'},
        {x1:-1.75,x2:-1.35,z1:-2.05,z2:-1.15,y1:0.30,y2:1.86,n:'Mandir'}],
  prod:[]
};
fetch('placements.json').then(function(r){ return r.json(); }).then(function(J){
  J.products.forEach(function(p){
    var REAL = {'Torque Berlin L-Shaped Sofa':0.61, 'Enfurnish Sheesham Coffee Table':0.38, 'Paper Plane Abstract Canvas 122 x 81':1.1, '10-Light Linear Glass Chandelier':0.79, 'UAG 7 Running Horses':0.30, 'BEHOMA Brass Peacock Urli':0.07, 'Auromin Metal & Wood Wall Clock':0.5, 'Woodshoppe Shisham Cutlery Caddy':0.10};
    var x = p.pos[0], y = p.pos[1], z = p.pos[2], h = REAL[p.name] || p.height || p.length || 0.3, k = 'top', wall = null;
    if (p.alignLeft !== undefined){ x = p.alignLeft; wall = 'left'; }
    if (/Clock/.test(p.name)) wall = 'front';
    if (p.hang) k = 'ceiling'; else if (wall && y >= 0.9) k = 'wall'; else if (y < 0.12) k = 'floor';
    P.prod.push({n:p.name, k:k, x:x, y:y, z:z, h:h, wall:wall});
    var li = document.createElement('li'); li.textContent = p.name; document.getElementById('list').appendChild(li);
  });
  document.getElementById('plan').appendChild(drawPlan(P)); document.getElementById('model').appendChild(drawModel(P));
});

/* floor plan: the Motif Labs site's drawPlan, with plain openings, zone labels and the balcony outside */
function drawPlan(P){
  var svg = el('svg', {viewBox:'0 0 600 560'});
  var spanX = P.w + 1.4, spanZ = P.d + 1.6;
  var p = Math.min(520/spanX, 500/spanZ), ox = 300 - (P.x1+P.x2)/2*p, oy = 290 - 0.4*p;
  var X = function(x){ return ox + x*p; }, Z = function(z){ return oy + z*p; };
  var gx; for (gx = P.x1 + 0.5; gx < P.x2; gx += 0.5) el('line', {x1:X(gx), y1:Z(P.z1), x2:X(gx), y2:Z(P.z2), stroke:ICE, 'stroke-opacity':.1}, svg);
  var gz; for (gz = P.z1 + 0.5; gz < P.z2; gz += 0.5) el('line', {x1:X(P.x1), y1:Z(gz), x2:X(P.x2), y2:Z(gz), stroke:ICE, 'stroke-opacity':.1}, svg);
  // balcony, kitchen and corridor outside the hall (dashed)
  el('rect', {x:X(P.x1), y:Z(P.z1-1.6), width:P.w*p, height:1.4*p, fill:'none', stroke:ICE, 'stroke-dasharray':'6 5', 'stroke-opacity':.7}, svg);
  label(svg, X(0), Z(P.z1-0.85), 'BALCONY', {size:11, fill:'#a9c4f5'});
  el('rect', {x:X(P.x1-2.0), y:Z(-3.35-0.5), width:2.0*p, height:2.0*p, fill:'none', stroke:ICE, 'stroke-dasharray':'6 5', 'stroke-opacity':.7}, svg);
  label(svg, X(P.x1-1.0), Z(-2.85), 'KITCHEN', {size:11, fill:'#a9c4f5'});
  el('rect', {x:X(P.x1-1.6), y:Z(-0.25), width:1.6*p, height:1.0*p, fill:'none', stroke:ICE, 'stroke-dasharray':'6 5', 'stroke-opacity':.7}, svg);
  label(svg, X(P.x1-0.8), Z(0.3), 'TO BEDROOMS', {size:10, fill:'#a9c4f5'});
  P.rug.forEach(function(r){ el('rect', {x:X(r.x1), y:Z(r.z1), width:(r.x2-r.x1)*p, height:(r.z2-r.z1)*p, fill:'rgba(207,224,255,.05)', stroke:ICE, 'stroke-dasharray':'5 5', 'stroke-opacity':.55}, svg); });
  el('rect', {x:X(P.x1), y:Z(P.z1), width:P.w*p, height:P.d*p, fill:'none', stroke:'#fff', 'stroke-width':7}, svg);
  // false-ceiling trays (dotted)
  [[-1.15,1.15,0.55,3.35],[-0.95,0.75,-3.10,-0.95]].forEach(function(t){ el('rect', {x:X(t[0]), y:Z(t[2]), width:(t[1]-t[0])*p, height:(t[3]-t[2])*p, fill:'none', stroke:'#ffd28a', 'stroke-dasharray':'2 4', 'stroke-opacity':.75}, svg); });
  P.open.forEach(function(o){
    var vert = (o.x1 === o.x2), a = vert ? o.z1 : o.x1, b = vert ? o.z2 : o.x2, c = vert ? o.x1 : o.z1;
    var pt = function(t, off){ off = off || 0; return vert ? [X(c)+off, Z(t)] : [X(t), Z(c)+off]; };
    var A = pt(a), B = pt(b);
    el('line', {x1:A[0], y1:A[1], x2:B[0], y2:B[1], stroke:BG, 'stroke-width':10}, svg);
    if (o.kind === 'window'){ [-3, 3].forEach(function(off){ var A2 = pt(a, off), B2 = pt(b, off); el('line', {x1:A2[0], y1:A2[1], x2:B2[0], y2:B2[1], stroke:ICE, 'stroke-width':1.3}, svg); }); }
    else if (o.kind === 'door'){
      var L = (b - a) * p, hinge = B, tip = [B[0], B[1] - L];
      el('line', {x1:hinge[0], y1:hinge[1], x2:tip[0], y2:tip[1], stroke:ICE, 'stroke-width':1.4}, svg);
      el('path', {d:'M'+tip[0]+' '+tip[1]+' A '+L+' '+L+' 0 0 0 '+A[0]+' '+A[1], fill:'none', stroke:ICE, 'stroke-width':1, 'stroke-dasharray':'3 3'}, svg);
      label(svg, (A[0]+B[0])/2, B[1]+18, 'MAIN DOOR', {size:10, fill:'#a9c4f5'});
    }
  });
  P.furn.forEach(function(f){
    el('rect', {x:X(f.x1), y:Z(f.z1), width:(f.x2-f.x1)*p, height:(f.z2-f.z1)*p, fill:'rgba(207,224,255,.08)', stroke:ICE, 'stroke-width':1.5, rx:2}, svg);
    var w = (f.x2-f.x1)*p, h = (f.z2-f.z1)*p;
    if (f.n && Math.max(w,h) > 40) label(svg, X((f.x1+f.x2)/2), Z((f.z1+f.z2)/2)+4, f.n.toUpperCase(), {size:9.5, fill:'#a9c4f5', rot:(h>w*1.3?-90:0)});
  });
  P.prod.forEach(function(q){
    var cx = X(q.x), cz = Z(q.z);
    if (q.k === 'wall'){
      var half = Math.max(q.h*0.8, 0.3)*p/2, horiz = (q.wall === 'front' || q.wall === 'back');
      el('line', horiz ? {x1:cx-half, y1:cz, x2:cx+half, y2:cz, stroke:ORG, 'stroke-width':4, 'stroke-linecap':'round'} : {x1:cx, y1:cz-half, x2:cx, y2:cz+half, stroke:ORG, 'stroke-width':4, 'stroke-linecap':'round'}, svg);
    } else if (q.k === 'ceiling'){
      el('circle', {cx:cx, cy:cz, r:Math.max(q.h*0.5,0.25)*p, fill:'none', stroke:ORG, 'stroke-dasharray':'4 4', 'stroke-width':1.5}, svg);
      el('circle', {cx:cx, cy:cz, r:3, fill:ORG}, svg);
    } else {
      var r = q.k === 'floor' ? Math.max(0.15*p, 6) : Math.max(0.07*p, 3.5);
      el('circle', {cx:cx, cy:cz, r:r, fill:'rgba(255,138,82,.22)', stroke:ORG, 'stroke-width':1.6}, svg);
    }
  });
  label(svg, X(-0.15), Z(-0.45), 'DINING', {size:13, fill:'#ffffff'}); label(svg, X(0.2), Z(0.40), 'LIVING', {size:13, fill:'#ffffff'});
  label(svg, X(0.85), Z(3.6), 'ENTRY', {size:11, fill:'#ffffff'});
  var dim = function(x1,y1,x2,y2,str,rot,lx,ly){ el('line', {x1:x1,y1:y1,x2:x2,y2:y2,stroke:ICE}, svg); [[x1,y1],[x2,y2]].forEach(function(q){ el('line', (x1===x2) ? {x1:q[0]-5,y1:q[1],x2:q[0]+5,y2:q[1],stroke:ICE} : {x1:q[0],y1:q[1]-5,x2:q[0],y2:q[1]+5,stroke:ICE}, svg); }); label(svg, lx, ly, str, {size:12, rot:rot, halo:true}); };
  dim(X(P.x1), Z(P.z2)+34, X(P.x2), Z(P.z2)+34, P.w.toFixed(1)+' m', 0, X(0), Z(P.z2)+38);
  dim(X(P.x2)+30, Z(P.z1), X(P.x2)+30, Z(P.z2), P.d.toFixed(1)+' m', 90, X(P.x2)+26, Z(0));
  el('circle', {cx:26, cy:540, r:5, fill:'rgba(255,138,82,.22)', stroke:ORG, 'stroke-width':1.6}, svg);
  label(svg, 38, 544, 'Tappable product', {size:11, anchor:'start', fill:'#a9c4f5'});
  el('line', {x1:170, y1:540, x2:190, y2:540, stroke:'#ffd28a', 'stroke-dasharray':'2 4'}, svg);
  label(svg, 196, 544, 'False-ceiling tray (cove light)', {size:11, anchor:'start', fill:'#a9c4f5'});
  return svg;
}

/* isometric model: the Motif Labs site's drawModel (back = balcony wall, left = sofa / kitchen wall) */
function drawModel(P){
  var svg = el('svg', {viewBox:'0 0 600 560'}), C = 0.866;
  var W = P.w, D = P.d, H = P.h;
  var raw = function(x,y,z){ return [(x-y)*C, (x+y)*0.5 - z]; };
  var cs = [[0,0,0],[W,0,0],[0,D,0],[W,D,0],[0,0,H],[W,0,H],[0,D,H]].map(function(c){ return raw(c[0],c[1],c[2]); });
  var minx = Math.min.apply(null, cs.map(function(c){return c[0];})), maxx = Math.max.apply(null, cs.map(function(c){return c[0];}));
  var miny = Math.min.apply(null, cs.map(function(c){return c[1];})), maxy = Math.max.apply(null, cs.map(function(c){return c[1];}));
  var s = Math.min(540/(maxx-minx), 470/(maxy-miny)), ox = 300 - s*(minx+maxx)/2, oy = 280 - s*(miny+maxy)/2;
  var Pj = function(x,y,z){ return [ox + (x-y)*C*s, oy + ((x+y)*0.5 - z)*s]; };
  // seen from the other corner: the right wall (TV wall, crockery unit) is drawn as the far side wall, so tall units don't hide the room
  var wx = function(x){ return P.x2 - x; }, wz = function(z){ return z - P.z1; };
  var ln = function(a,b,stroke,w,op,dash){ var A = Pj.apply(null,a), B = Pj.apply(null,b); el('line', {x1:A[0],y1:A[1],x2:B[0],y2:B[1],stroke:stroke,'stroke-width':w||1.2,'stroke-opacity':op==null?1:op,'stroke-dasharray':dash||''}, svg); };
  var gx; for (gx = 0.5; gx < W; gx += 0.5) ln([gx,0,0],[gx,D,0],ICE,1,.16);
  var gz; for (gz = 0.5; gz < D; gz += 0.5) ln([0,gz,0],[W,gz,0],ICE,1,.16);
  ln([0,0,0],[W,0,0],'#fff',2); ln([0,0,0],[0,D,0],'#fff',2); ln([W,0,0],[W,D,0],'#fff',1.4,.8); ln([0,D,0],[W,D,0],'#fff',1.4,.8);
  ln([0,0,0],[0,0,H],'#fff',2); ln([W,0,0],[W,0,H],'#fff',1.2,.7); ln([0,D,0],[0,D,H],'#fff',1.2,.7);
  ln([0,0,H],[W,0,H],'#fff',1.2,.7); ln([0,0,H],[0,D,H],'#fff',1.2,.7);
  var poly = function(pts, stroke, fill, w){ el('polygon', {points:pts.map(function(q){return q.join(',');}).join(' '), fill:fill, stroke:stroke, 'stroke-width':w||1.4, 'stroke-linejoin':'round'}, svg); };
  // openings on the two drawn walls: the balcony door (back), kitchen + passage (left)
  P.open.forEach(function(o){
    var q;
    if (o.z1 === o.z2 && Math.abs(o.z1 - P.z1) < 0.01) q = [[wx(o.x1),0,0],[wx(o.x2),0,0],[wx(o.x2),0,o.y2],[wx(o.x1),0,o.y2]]; else return;
    poly(q.map(function(c){ return Pj(c[0],c[1],c[2]); }), ICE, 'rgba(207,224,255,.08)', 1.3);
  });
  var bx = function(x1,y1,z1,x2,y2,z2,stroke,fill){
    var c = Pj;
    poly([c(x1,y1,z2),c(x2,y1,z2),c(x2,y2,z2),c(x1,y2,z2)], stroke, fill);
    poly([c(x2,y1,z1),c(x2,y2,z1),c(x2,y2,z2),c(x2,y1,z2)], stroke, fill);
    poly([c(x1,y2,z1),c(x2,y2,z1),c(x2,y2,z2),c(x1,y2,z2)], stroke, fill);
  };
  P.rug.forEach(function(r){ var a = Pj(wx(r.x1),wz(r.z1),0.01), b = Pj(wx(r.x2),wz(r.z1),0.01), c = Pj(wx(r.x2),wz(r.z2),0.01), d = Pj(wx(r.x1),wz(r.z2),0.01); poly([a,b,c,d], ICE, 'rgba(207,224,255,.06)', 1); });
  var fill = 'rgba(255,138,82,.2)';
  var items = P.furn.map(function(f){ return {t:'f', f:f, key:f.x2+f.z2}; }).concat(P.prod.map(function(q){ return {t:'p', q:q, key:q.x+q.z+0.01}; }));
  items.sort(function(a,b){ return a.key - b.key; }).forEach(function(it){
    if (it.t === 'f'){ var f = it.f; bx(wx(f.x2),wz(f.z1),Math.max(f.y1,0),wx(f.x1),wz(f.z2),f.y2,ICE,'rgba(207,224,255,.10)'); return; }
    var q = it.q, X0 = wx(q.x), Y0 = wz(q.z);
    if (q.k === 'wall'){
      var hw = Math.max(q.h*0.8, 0.3)/2;
      if (q.wall === 'left') poly([[W,Y0-hw,q.y],[W,Y0+hw,q.y],[W,Y0+hw,q.y+q.h],[W,Y0-hw,q.y+q.h]].map(function(c){ return Pj(c[0],c[1],c[2]); }), ORG, fill, 1.6);
      else if (q.wall === 'front') poly([[X0-hw,D,q.y],[X0+hw,D,q.y],[X0+hw,D,q.y+q.h],[X0-hw,D,q.y+q.h]].map(function(c){ return Pj(c[0],c[1],c[2]); }), ORG, fill, 1.6);
    } else if (q.k === 'ceiling'){ var hs = 0.16; bx(X0-hs,Y0-0.5,H-0.8,X0+hs,Y0+0.5,H,ORG,fill); }
    else { var f2 = q.k === 'floor' ? 0.13 : 0.07; bx(X0-f2,Y0-f2,q.y,X0+f2,Y0+f2,q.y+Math.max(q.h,0.05),ORG,fill); }
  });
  var dimLine = function(a,b,str,dx,dy){ var A = Pj.apply(null,a), B = Pj.apply(null,b); el('line',{x1:A[0]+dx,y1:A[1]+dy,x2:B[0]+dx,y2:B[1]+dy,stroke:ICE,'stroke-width':1},svg); label(svg, (A[0]+B[0])/2+dx, (A[1]+B[1])/2+dy-6, str, {size:12, halo:true}); };
  dimLine([0,D,0],[W,D,0],W.toFixed(1)+' m',-14,22);
  dimLine([W,0,0],[W,D,0],D.toFixed(1)+' m',22,14);
  dimLine([0,0,0],[0,0,H],H.toFixed(1)+' m',-26,0);
  return svg;
}
</script></body></html>
