<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Urban Nest · Offline</title>
<meta name="robots" content="noindex"/>
<meta name="theme-color" content="#0E3238"/>
<link rel="icon" type="image/png" href="/favicon.png"/>
<!-- Shown by sw.js when there is no connection and the page asked for was
     never opened before. It is the one page guaranteed to be on the phone,
     so it loads nothing from anywhere else: no Google Fonts, no Supabase.
     One look in both themes — the nav band's teal — so it needs no toggle. -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 24px;
    background: #0E3238; color: #EAF2F1;
    font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  main { max-width: 360px; }
  .mark {
    width: 88px; height: 88px; margin: 0 auto 28px;
    border-radius: 50%; background: #F5F7F6; padding: 8px;
  }
  .mark img { display: block; width: 100%; height: 100%; }
  h1 {
    font-family: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
    font-weight: 400; font-size: 30px; letter-spacing: 0.01em; margin-bottom: 12px;
  }
  p { font-size: 15px; line-height: 1.6; color: rgba(234,242,241,0.72); }
  button {
    margin-top: 28px; padding: 12px 28px;
    font: inherit; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase;
    color: #EAF2F1; background: transparent;
    border: 1px solid #C2934D; border-radius: 999px; cursor: pointer;
  }
  button:hover, button:focus-visible { background: rgba(194,147,77,0.16); outline: none; }
</style>
</head>
<body>
<main>
  <div class="mark"><img src="/favicon.png" alt="Urban Nest"/></div>
  <h1>You're offline</h1>
  <p>The rooms and the collection need a connection. Pages you have opened before will still open.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
